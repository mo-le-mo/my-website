<!DOCTYPE html>
<html>
<head>
<title>CloudScale Platform</title>
<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#081224;
    color:white;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:40px;
}

.hero{
    text-align:center;
}

.hero h1{
    font-size:60px;
}

.status{
    background:#22c55e;
    width:300px;
    padding:15px;
    margin:20px auto;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:40px;
}

.card{
    background:#13264d;
    padding:25px;
    border-radius:15px;
}

.card h3{
    color:#66d9ff;
}

footer{
    margin-top:40px;
    text-align:center;
}
</style>
</head>
<body>

<div class="container">

<div class="hero">
<h1>CloudScale Platform</h1>
<p>GitHub • Ubuntu VM • Nginx • CI/CD</p>

<div class="status">
✅ Infrastructure Online
</div>
</div>

<div class="cards">

<div class="card">
<h3>GitHub</h3>
<p>Repository Connected</p>
</div>

<div class="card">
<h3>Ubuntu VM</h3>
<p>Deployment Environment</p>
</div>

<div class="card">
<h3>Nginx</h3>
<p>Hosting Active</p>
</div>

<div class="card">
<h3>Automation</h3>
<p>Deployment Ready</p>
</div>

</div>

<footer>
CloudScale DevOps Demonstration Platform
</footer>

</div>

</body>
</html>
